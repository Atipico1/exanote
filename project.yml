name: Exanote
options:
  bundleIdPrefix: app.exanote
  developmentLanguage: ko
  deploymentTarget:
    macOS: "15.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Exanote:
    type: application
    dependencies:
      - package: Sparkle
    platform: macOS
    sources:
      - path: native/App
    info:
      path: native/App/Info.plist
      properties:
        CFBundleDisplayName: Exanote
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "7"
        SUFeedURL: https://atipico1.github.io/exanote/appcast.xml
        SUPublicEDKey: daaF3+9ccPQYQpEcaB0qcpErUuPqHQVGHDTrIEGh62o=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        NSMicrophoneUsageDescription: 녹음을 시작한 회의에서만 내 목소리를 녹음해요.
        NSCalendarsFullAccessUsageDescription: 다가올 회의를 홈에 보여 주고 일정 이름으로 녹음을 시작할 수 있게 해요. 일정은 이 Mac 밖으로 나가지 않아요.
        NSAudioCaptureUsageDescription: 녹음을 시작한 회의에서만 상대방 목소리(다른 앱의 소리)를 녹음해요. 화면은 녹화하지 않아요.
        NSFileProviderDomainUsageDescription: 선택한 iCloud Drive나 Google Drive 폴더에 회의 전사와 요약을 저장하고 팀과 공유해요.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google Cloud project exanote-app, OAuth client for this bundle ID (GoogleAccount.swift).
        ExanoteGoogleClientID: 251531621234-lbp54a575gcjrtr0ppopiivbres41v3k.apps.googleusercontent.com
        # Google redirects the browser sign-in back to the app through the reversed client ID.
        CFBundleURLTypes:
          - CFBundleURLName: Google sign-in
            CFBundleURLSchemes: [com.googleusercontent.apps.251531621234-lbp54a575gcjrtr0ppopiivbres41v3k]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.exanote.macos
        SWIFT_VERSION: "5.10"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
